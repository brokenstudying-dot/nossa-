<style>
  :root{
    /* Modernist palette — light ground, near-black ink, vivid red accent.
       Variable NAMES are kept from the old dark theme so every existing
       rule keeps working; only their values changed. */
    --ink:#f3f2f2;        /* page ground (was near-black) */
    --ink-2:#eae9e9;      /* raised surface */
    --card:#eae9e9;       /* card surface */
    --paper:#201e1d;      /* primary text (was off-white) */
    --paper-dim:#6b6867;   /* muted text */
    --brass:#ec3013;      /* accent */
    --brass-dim:#b3200c;
    --rust:#dd2b0f;
    --steel:#d7d3d3;
    --line: rgba(32,30,29,0.22);
    --radius: 0px;         /* Modernist: sharp corners throughout */
    --disp: 'Archivo', system-ui, sans-serif;
    --body: 'Archivo', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', monospace;
  }

  /* Dark mode: same Modernist structure, inverted ground. Every rule in
     this file reads these variables, so the whole app follows. */
  html[data-theme="dark"]{
    --ink:#171615;
    --ink-2:#211f1e;
    --card:#211f1e;
    --paper:#f3f2f2;
    --paper-dim:#a5a1a0;
    --brass:#ff5334;
    --brass-dim:#d93c1e;
    --rust:#ff5334;
    --steel:#3a3736;
    --line: rgba(243,242,242,0.20);
  }
  html{background:var(--ink);}
  /* Buttons put dark text on the accent in light mode; in dark mode the
     accent needs the dark ground behind the label to stay readable. */
  html[data-theme="dark"] .btn{color:#171615;}
  html[data-theme="dark"] .btn.secondary{color:var(--paper);}
  html[data-theme="dark"] .btn.ghost{color:var(--brass);}
  html[data-theme="dark"] .btn:disabled{opacity:0.35;}
  html[data-theme="dark"] .poster{color:#171615;}
  html[data-theme="dark"] .poster h2{color:#171615;}
  html[data-theme="dark"] .poster-cta a.solid{background:#171615; color:var(--brass);}
  html[data-theme="dark"] .poster-cta a.outline{border-color:#171615; color:#171615;}
  html[data-theme="dark"] .book-steps li.on{color:#171615;}
  html[data-theme="dark"] .opt.sel, html[data-theme="dark"] .chip.sel{color:#171615;}
  html[data-theme="dark"] .receipt .top{color:#171615;}
  html[data-theme="dark"] .logo-badge{background:#f3f2f2; padding:3px;}
  html[data-theme="dark"] .logo-badge img{mix-blend-mode:multiply;}
  html[data-theme="dark"] .work-grid img{filter:grayscale(1) contrast(1.05) brightness(0.9);}
  .theme-btn{
    background:transparent; border:2px solid var(--line); padding:7px 10px;
    font-size:14px; line-height:1; cursor:pointer; color:var(--paper);
  }
  .theme-btn:hover{border-color:var(--brass); color:var(--brass);}
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--ink);
    color:var(--paper);
    font-family:var(--body);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  img{max-width:100%; display:block;}
  button{font-family:inherit; cursor:pointer;}
  input, select{font-family:inherit;}
  a{color:inherit;}
  .stripe-bg{
    background-image: repeating-linear-gradient(15deg,
      var(--brass) 0px, var(--brass) 26px,
      transparent 26px, transparent 130px);
    opacity:0.06;
  }
  /* ---------- NAV ---------- */
  /* ---------- NAV (design-accurate) ---------- */
  .nav{
    position:sticky; top:0; z-index:50;
    display:flex; align-items:center; gap:24px;
    padding:14px 32px;
    background:var(--ink);
    border-bottom:2px solid var(--line);
  }
  .logo{
    font-family:var(--disp); font-weight:800;
    font-size:22px; letter-spacing:0.14em;
    color:var(--paper);
    display:flex; align-items:center; gap:10px;
    margin-inline-end:auto;
  }
  .logo-badge{background:transparent; border-radius:0; padding:0; display:inline-flex; flex-shrink:0;}
  .logo-badge img{display:block; border-radius:0; mix-blend-mode:multiply;}
  .nav-links{display:flex; align-items:center; gap:26px;
    font-size:13px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase;}
  .nav-links a{text-decoration:none; color:var(--paper); transition:color .15s;}
  .nav-links a:hover{color:var(--brass);}
  .lang-btn{
    background:transparent; border:2px solid var(--line); padding:7px 12px;
    font-family:var(--disp); font-weight:800; font-size:12px; letter-spacing:0.08em;
    cursor:pointer; color:var(--paper);
  }
  .lang-btn:hover{border-color:var(--brass); color:var(--brass);}

  /* ---------- HERO (design-accurate: left aligned, huge type) ---------- */
  .wrap{max-width:1240px; margin:0 auto;}
  .hero{padding:72px 32px 0; text-align:start;}
  .kicker{
    font-size:12px; font-weight:600; letter-spacing:0.18em;
    text-transform:uppercase; color:var(--brass-dim); margin-bottom:20px;
  }
  .hero h1{
    font-family:var(--disp); font-weight:800;
    font-size:clamp(56px,10vw,132px); line-height:0.9;
    letter-spacing:-0.03em; margin:0; max-width:14ch;
    color:var(--paper);
  }
  .hero-grid{
    display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:40px; align-items:end; margin-top:36px; padding-bottom:36px;
  }
  .hero-grid p{font-size:19px; line-height:1.5; max-width:46ch; margin:0;}
  .hero-cta{display:flex; gap:12px; flex-wrap:wrap; justify-self:start;}

  /* ---------- STATS BAR ---------- */
  .stats-band{border-top:2px solid var(--line); border-bottom:2px solid var(--line);}
  .stats-grid{
    max-width:1240px; margin:0 auto;
    display:grid; grid-template-columns:repeat(4,minmax(0,1fr));
  }
  .stat-cell{padding:26px 32px; border-inline-end:2px solid var(--line);}
  .stat-cell:last-child{border-inline-end:none;}
  .stat-cell .n{font-family:var(--disp); font-weight:800; font-size:40px; line-height:1;}
  .stat-cell .n.accent{color:var(--brass);}
  .stat-cell .l{font-size:11px; letter-spacing:0.14em; text-transform:uppercase; margin-top:6px;}

  /* ---------- BUTTONS (design-accurate: square, Archivo 800) ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    font-family:var(--disp); font-weight:800; font-size:14px; line-height:1.2;
    padding:9px 18px; border-radius:0; border:2px solid transparent;
    background:var(--brass); color:var(--ink);
    text-decoration:none; cursor:pointer;
    transition:background .15s, border-color .15s, color .15s;
  }
  .btn:hover{background:var(--brass-dim);}
  .btn.secondary{background:transparent; color:var(--paper); border-color:var(--line);}
  .btn.secondary:hover{background:rgba(32,30,29,0.07); border-color:var(--line);}
  .btn.ghost{background:transparent; color:var(--brass); border-color:transparent; padding:9px 6px;}
  .btn.ghost:hover{background:rgba(236,48,19,0.10);}
  .btn:disabled{opacity:0.45; cursor:not-allowed;}
  .btn.small{padding:8px 14px; font-size:13px;}
  .btn.large{padding:16px 28px; font-size:15px;}
  .btn.danger{background:var(--rust); color:var(--ink);}

  /* ---------- SECTION SHELL ---------- */
  section{padding:80px 32px;}
  .sec-head{display:flex; align-items:baseline; gap:20px; flex-wrap:wrap; margin-bottom:32px;}
  .sec-head h2{
    font-family:var(--disp); font-weight:800;
    font-size:clamp(34px,5vw,60px); line-height:1;
    letter-spacing:-0.02em; margin:0; color:var(--paper);
  }
  .sec-note{font-size:15px; margin:0 0 32px; max-width:52ch;}
  .hr{height:2px; border:0; margin:0 0 40px; background:var(--line);}

  /* ---------- WORK (before/after) ---------- */
  .work-grid{
    display:grid; grid-template-columns:repeat(2,minmax(0,1fr));
    gap:2px; background:var(--line); border:2px solid var(--line);
  }
  .work-grid figure{margin:0; background:var(--ink);}
  .work-grid .shot{aspect-ratio:3/4; overflow:hidden;}
  .work-grid img{width:100%; height:100%; object-fit:cover; display:block;
    filter:grayscale(1) contrast(1.08);}
  .work-grid figcaption{
    padding:14px 18px; font-family:var(--disp); font-weight:800;
    font-size:13px; letter-spacing:0.16em; text-transform:uppercase;
    border-top:2px solid var(--line);
  }
  .work-grid figcaption.after{color:var(--brass);}

  /* ---------- PRICES ---------- */
  .prices-grid{display:grid; grid-template-columns:minmax(0,340px) minmax(0,1fr); gap:48px; align-items:start;}
  .price-table{width:100%; border-collapse:collapse;}
  .price-table th{
    text-align:start; font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    padding:10px 0; border-bottom:2px solid var(--line); font-weight:600;
  }
  .price-table td{padding:16px 0; border-bottom:1px solid var(--line); font-size:14px;}
  .price-table td.name{font-family:var(--disp); font-weight:800; font-size:18px;}
  .price-table td.amt{font-family:var(--disp); font-weight:800; font-size:18px; text-align:end;}

  /* ---------- BRANCHES ---------- */
  .branch-band{border-top:2px solid var(--line); border-bottom:2px solid var(--line);}
  .branch-grid{max-width:1240px; margin:0 auto; display:grid; grid-template-columns:repeat(2,minmax(0,1fr));}
  .branch-cell{padding:40px 32px; border-inline-end:2px solid var(--line);}
  .branch-cell:last-child{border-inline-end:none;}
  .branch-cell h3{font-family:var(--disp); font-weight:800; font-size:30px; line-height:1; letter-spacing:-0.02em; margin:0 0 10px;}
  .branch-cell p{margin:0 0 4px; font-size:15px;}

  /* ---------- POSTER ---------- */
  .poster{background:var(--brass); color:var(--ink); padding:72px 32px;}
  .poster h2{
    font-family:var(--disp); font-weight:800;
    font-size:clamp(38px,7vw,88px); line-height:0.95;
    letter-spacing:-0.03em; margin:0; max-width:16ch; color:var(--ink);
  }
  .poster-cta{display:flex; gap:12px; flex-wrap:wrap; margin-top:32px;}
  .poster-cta a{
    display:inline-flex; align-items:center; padding:16px 28px;
    font-family:var(--disp); font-weight:800; font-size:15px; text-decoration:none;
  }
  .poster-cta a.solid{background:var(--ink); color:var(--brass);}
  .poster-cta a.outline{border:2px solid var(--ink); color:var(--ink);}

  /* ---------- FOOTER ---------- */
  footer{padding:40px 32px; border-top:2px solid var(--line);}
  .footer-row{max-width:1240px; margin:0 auto; display:flex;
    justify-content:space-between; gap:24px; flex-wrap:wrap; align-items:baseline;}
  .footer-row .mark{font-family:var(--disp); font-weight:800; font-size:18px; letter-spacing:0.14em;}
  .footer-row a{color:var(--brass); font-size:13px; font-weight:600;}

  @media(max-width:860px){
    .hero-grid, .prices-grid, .work-grid, .branch-grid{grid-template-columns:minmax(0,1fr);}
    .stats-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
    .stat-cell{border-bottom:2px solid var(--line);}
  }

  /* ---------- BOOKING MODULE (design: step rail + panel) ---------- */
  .book-grid{display:grid; grid-template-columns:minmax(0,220px) minmax(0,1fr);
    border:2px solid var(--line);}
  .book-steps{list-style:none; margin:0; padding:0; border-inline-end:2px solid var(--line);}
  .book-steps li{
    display:flex; align-items:center; gap:12px; padding:18px 20px;
    border-bottom:1px solid var(--line);
    font-size:13px; letter-spacing:0.08em; text-transform:uppercase; font-weight:600;
    color:var(--paper-dim);
  }
  .book-steps li .num{font-family:var(--disp); font-weight:800; font-size:12px; width:22px;}
  .book-steps li.done{color:var(--brass);}
  .book-steps li.on{background:var(--brass); color:var(--ink);}
  .book-panel{padding:32px; min-height:420px;}
  .book-panel h3{font-family:var(--disp); font-weight:800; font-size:26px;
    margin:0 0 18px; letter-spacing:-0.01em; color:var(--paper);}
  .opt-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:12px;}
  .opt{
    text-align:start; padding:18px; cursor:pointer;
    background:var(--ink); border:2px solid var(--line); color:var(--paper);
    font-family:var(--body); border-radius:0; transition:border-color .12s;
  }
  .opt:hover:not(:disabled){border-color:var(--brass);}
  .opt.sel{background:var(--brass); border-color:var(--brass); color:var(--ink);}
  .opt .t{font-family:var(--disp); font-weight:800; font-size:18px;}
  .opt .s{font-size:13px; margin-top:4px;}
  .opt:disabled{opacity:0.4; cursor:not-allowed; text-decoration:line-through;}
  .chip-row{display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap;}
  .chip{
    padding:12px 20px; cursor:pointer; background:var(--ink);
    border:2px solid var(--line); color:var(--paper);
    font-family:var(--disp); font-weight:800; font-size:14px; border-radius:0;
  }
  .chip:hover:not(:disabled){border-color:var(--brass);}
  .chip.sel{background:var(--brass); border-color:var(--brass); color:var(--ink);}
  .chip:disabled{opacity:0.4; cursor:not-allowed;}
  .slot-wrap{display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:8px;}
  .book-nav{
    display:flex; justify-content:space-between; gap:12px; align-items:center;
    margin-top:32px; padding-top:20px; border-top:2px solid var(--line);
  }
  .running{font-family:var(--disp); font-weight:800; font-size:18px;}
  .receipt{max-width:460px; border:2px solid var(--paper);}
  .receipt .top{background:var(--brass); color:var(--ink); padding:18px 22px;}
  .receipt .top .lbl{font-size:11px; letter-spacing:0.2em; text-transform:uppercase;}
  .receipt .top .mk{font-family:var(--disp); font-weight:800; font-size:32px; letter-spacing:0.1em; line-height:1.1;}
  .receipt .body{padding:22px;}
  .receipt .r{display:flex; justify-content:space-between; gap:16px; padding:9px 0;
    border-bottom:1px solid var(--line); font-size:14px;}
  .receipt .r span:last-child{font-weight:600; text-align:end;}
  .receipt .tot{display:flex; justify-content:space-between; padding-top:14px; margin-top:8px;
    border-top:2px solid var(--paper); font-family:var(--disp); font-weight:800; font-size:22px;}
  @media(max-width:760px){ .book-grid{grid-template-columns:minmax(0,1fr);}
    .book-steps{display:flex; overflow-x:auto; border-inline-end:none; border-bottom:2px solid var(--line);}
    .book-steps li{border-bottom:none; white-space:nowrap;} }

  /* ---------- BARBERS ---------- */
  .barber-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:20px;}
  .barber-card{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:26px; display:flex; flex-direction:column; gap:14px;
    transition:border-color .15s, transform .15s;
  }
  .barber-card:hover{border-color:var(--brass-dim); transform:translateY(-2px);}
  .avatar{
    width:64px;height:64px;border-radius:50%;
    background:linear-gradient(135deg,var(--brass),var(--rust));
    display:flex;align-items:center;justify-content:center;
    font-family:var(--disp); font-weight:800; font-size:24px; color:var(--ink); letter-spacing:1px;
  }
  .barber-card h3{font-family:var(--disp); font-weight:800; font-size:24px; letter-spacing:1px;}
  .barber-card .spec{color:var(--paper-dim); font-size:14px; min-height:38px;}
  .barber-meta{display:flex; justify-content:space-between; align-items:center; font-family:var(--mono); font-size:12.5px; color:var(--paper-dim); border-top:1px dashed var(--line); padding-top:12px;}
  .barber-meta .price{color:var(--brass); font-size:16px; font-weight:600;}

  /* ---------- BOOKING ---------- */
  .stepper{display:flex; justify-content:center; gap:6px; margin-bottom:48px; flex-wrap:wrap;}
  .step-pill{
    display:flex; align-items:center; gap:8px;
    font-family:var(--mono); font-size:12px; letter-spacing:1px;
    padding:8px 14px; border-radius:20px; border:1px solid var(--line);
    color:var(--paper-dim); text-transform:uppercase;
  }
  .step-pill .num{width:18px;height:18px;border-radius:50%;background:var(--ink-2); border:1px solid var(--line); display:flex;align-items:center;justify-content:center; font-size:10px;}
  .step-pill.active{border-color:var(--brass); color:var(--paper);}
  .step-pill.active .num{background:var(--brass); color:var(--ink); border-color:var(--brass);}
  .step-pill.done{color:var(--brass);}
  .step-pill.done .num{background:transparent; color:var(--brass); border-color:var(--brass);}

  .booking-panel{
    background:var(--card); border:1px solid var(--line); border-radius:var(--radius);
    padding:40px; max-width:760px; margin:0 auto;
  }
  .pick-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:12px;}
  .pick-card{
    background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; text-align:left; color:var(--paper);
  }
  .pick-card:hover{border-color:var(--brass-dim);}
  .pick-card.selected{border-color:var(--brass); background:rgba(236,48,19,0.06);}
  .pick-card b{display:block; font-family:var(--disp); font-weight:800; font-size:19px; letter-spacing:0.5px; margin-bottom:4px;}
  .pick-card span{font-size:12.5px; color:var(--paper-dim);}

  .day-row{display:flex; gap:10px; overflow-x:auto; padding-bottom:6px;}
  .day-pill{
    flex:0 0 auto; width:66px; text-align:center;
    background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius);
    padding:12px 6px;
  }
  .day-pill .dow{font-family:var(--mono); font-size:11px; color:var(--paper-dim); text-transform:uppercase;}
  .day-pill .dom{font-family:var(--disp); font-weight:800; font-size:26px; margin-top:2px;}
  .day-pill.selected{border-color:var(--brass); background:rgba(236,48,19,0.06);}

  .slot-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(90px,1fr)); gap:10px;}
  .slot{
    font-family:var(--mono); font-size:13px;
    background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius);
    padding:10px 6px; text-align:center; color:var(--paper);
  }
  .slot.selected{border-color:var(--brass); background:rgba(236,48,19,0.10); color:var(--brass);}
  .slot:disabled{opacity:0.28; text-decoration:line-through; cursor:not-allowed;}

  .field{margin-bottom:16px; text-align:left;}
  .field label{display:block; font-family:var(--mono); font-size:11.5px; letter-spacing:1px; text-transform:uppercase; color:var(--paper-dim); margin-bottom:6px;}
  .field input{
    width:100%; padding:12px 14px; background:var(--ink-2); border:1px solid var(--line);
    border-radius:var(--radius); color:var(--paper); font-size:15px;
  }
  .field input:focus{outline:none; border-color:var(--brass);}
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:14px;}

  .pay-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:20px;}
  .pay-card{background:var(--ink-2); border:1px solid var(--line); border-radius:var(--radius); padding:18px 12px; text-align:center;}
  .pay-card.selected{border-color:var(--brass); background:rgba(236,48,19,0.06);}
  .pay-card .icon{font-size:22px; margin-bottom:8px;}
  .pay-card b{display:block; font-size:13.5px; margin-bottom:2px;}
  .pay-card span{font-size:11.5px; color:var(--paper-dim);}
  .avatar-photo{width:64px;height:64px;border-radius:50%;object-fit:cover; border:2px solid var(--brass);}
  .pick-avatar{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--brass); margin-bottom:8px;}
  .pick-avatar-fallback{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--brass),var(--rust));display:flex;align-items:center;justify-content:center;font-family:var(--disp); font-weight:800;font-size:15px;color:var(--ink);margin-bottom:8px;}
  .photo-upload{display:flex; align-items:center; gap:14px;}
  .photo-preview{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--brass); flex:0 0 auto;}
  .photo-preview-empty{width:64px;height:64px;border-radius:50%;border:1px dashed var(--line); flex:0 0 auto; display:flex;align-items:center;justify-content:center; font-size:10px; color:var(--paper-dim); text-align:center;}
  .photo-upload input[type=file]{font-size:12px; color:var(--paper-dim);}
  .pay-detail{background:var(--ink-2); border:1px dashed var(--line); border-radius:var(--radius); padding:18px; font-size:13.5px; color:var(--paper-dim); margin-bottom:16px;}
  .pay-detail b{color:var(--paper);}

  .panel-nav{display:flex; justify-content:space-between; align-items:center; margin-top:28px; gap:12px;}
  .summary-line{display:flex; justify-content:space-between; font-size:14px; padding:8px 0; border-bottom:1px solid var(--line); color:var(--paper-dim);}
  .summary-line b{color:var(--paper); font-weight:600;}

  /* ---------- TICKET ---------- */
  .ticket{
    max-width:420px; margin:0 auto; position:relative;
    background:var(--paper); color:var(--ink); border-radius:var(--radius);
    padding:34px 30px; text-align:left;
  }
  .ticket::before,.ticket::after{
    content:''; position:absolute; width:26px; height:26px; border-radius:50%;
    background:var(--ink); top:50%; transform:translateY(-50%);
  }
  .ticket::before{left:-13px;}
  .ticket::after{right:-13px;}
  .ticket h3{font-family:var(--disp); font-weight:800; font-size:30px; letter-spacing:1px; margin-bottom:4px;}
  .ticket .sub{font-family:var(--mono); font-size:11.5px; color:var(--rust); letter-spacing:2px; text-transform:uppercase; margin-bottom:22px;}
  .ticket .row{display:flex; justify-content:space-between; padding:9px 0; border-bottom:1px dashed var(--line); font-size:14px;}
  .ticket .row span:first-child{color:#6b6867;}
  .ticket .row span:last-child{font-weight:600; font-family:var(--mono);}
  .ticket .total{margin-top:14px; padding-top:14px; border-top:2px solid var(--ink); display:flex; justify-content:space-between; font-family:var(--disp); font-weight:800; font-size:22px;}

  /* ---------- ADMIN ---------- */
  .admin-shell{min-height:100vh; display:flex;}
  .admin-side{width:220px; background:var(--ink-2); border-right:1px solid var(--line); padding:24px 18px; display:flex; flex-direction:column; gap:6px;}
  .admin-side button{
    text-align:left; background:transparent; border:none; color:var(--paper-dim);
    padding:11px 12px; border-radius:var(--radius); font-size:14px; letter-spacing:0.3px;
  }
  .admin-side button.active{background:rgba(236,48,19,0.08); color:var(--brass);}
  .admin-main{flex:1; padding:36px 40px; overflow-x:auto;}
  .admin-topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:28px;}
  .stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:30px;}
  .stat-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px;}
  .stat-card .n{font-family:var(--disp); font-weight:800; font-size:32px; color:var(--brass);}
  .stat-card .l{font-family:var(--mono); font-size:11px; text-transform:uppercase; letter-spacing:1px; color:var(--paper-dim);}
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{text-align:left; font-family:var(--mono); font-size:11px; letter-spacing:1px; text-transform:uppercase; color:var(--paper-dim); padding:10px 12px; border-bottom:1px solid var(--line);}
  td{padding:12px; border-bottom:1px solid var(--line); vertical-align:middle;}
  .badge{font-family:var(--mono); font-size:11px; padding:4px 9px; border-radius:12px; text-transform:uppercase; letter-spacing:0.5px;}
  .badge.confirmed{background:rgba(236,48,19,0.12); color:var(--brass);}
  .badge.completed{background:rgba(45,43,43,0.12); color:#444141;}
  .badge.cancelled{background:rgba(236,48,19,0.14); color:#b3200c;}
  .filters{display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap;}
  .filters select, .filters input{background:var(--ink-2); border:1px solid var(--line); color:var(--paper); padding:8px 10px; border-radius:var(--radius); font-size:13px;}
  .row-actions{display:flex; gap:6px;}
  .row-actions button{font-size:11.5px; padding:6px 10px; border-radius:var(--radius); border:1px solid var(--line); background:transparent; color:var(--paper-dim);}
  .row-actions button:hover{border-color:var(--brass); color:var(--brass);}

  .modal-back{position:fixed; inset:0; background:rgba(32,30,29,0.55); display:flex; align-items:center; justify-content:center; z-index:100; padding:20px;}
  .modal{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:34px; width:100%; max-width:380px;}
  .modal h3{font-family:var(--disp); font-weight:800; font-size:26px; letter-spacing:1px; margin-bottom:6px;}
  .modal p.hint{color:var(--paper-dim); font-size:13px; margin-bottom:20px;}
  .barber-form{display:flex; flex-direction:column; gap:12px; margin-top:18px;}
  .close-x{position:absolute; top:16px; right:20px; background:transparent; border:none; color:var(--paper-dim); font-size:20px;}

  footer{padding:40px 24px; text-align:center; color:var(--paper-dim); font-size:12.5px; font-family:var(--mono); border-top:1px solid var(--line);}

  .empty{text-align:center; padding:40px; color:var(--paper-dim); font-size:14px;}
  .error-text{color:#b3200c; font-size:12.5px; margin-top:6px; font-family:var(--mono);}

  @media (max-width:720px){
    .nav-links{gap:14px;}
    .field-row{grid-template-columns:1fr;}
    .pay-grid{grid-template-columns:1fr;}
    .admin-shell{flex-direction:column;}
    .admin-side{width:100%; flex-direction:row; overflow-x:auto;}
    .booking-panel{padding:24px;}
  }
</style>

/* Turn any thrown value / Supabase error into a plain, loggable string.
   Never pass the raw error object to console.error — in some preview/
   dev-tool sandboxes that relay console output via postMessage, an
   error object holding a non-cloneable value (like a fetch Headers
   instance) throws its own DataCloneError and hides the real message. */
function describeErr(e){
  if(!e) return 'unknown error';
  try{
    const parts = {};
    if(e.message) parts.message = e.message;
    if(e.code) parts.code = e.code;
    if(e.details) parts.details = e.details;
    if(e.hint) parts.hint = e.hint;
    if(e.status) parts.status = e.status;
    if(Object.keys(parts).length) return JSON.stringify(parts);
    return String(e);
  }catch(_){
    return 'unserializable error';
  }
}

async function insertBookingRow(bk){

  const row = {id:bk.id, name:bk.name, phone:bk.phone, email:bk.email, barber_id:bk.barberId, barber_name:bk.barberName, date:bk.date, time:bk.time, payment:bk.payment, price:bk.price, status:bk.status, payment_proof_path:bk.paymentProofPath||null, branch_id:bk.branchId||null, branch_name:bk.branchName||null, service_ids:bk.serviceIds||[], service_names:bk.serviceNames||null, duration_minutes:bk.durationMinutes||30};
  const {error} = await sb.from('bookings').insert(row);

      return {error: "That time was just booked by someone else — pick another time.", conflict:true};

  fetch(SEND_BOOKING_EMAILS_URL, {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({bookingId})
  }).catch(e => console.error('sendBookingEmails failed:', describeErr(e)));

async function updateBookingStatusRow(id, status){
  if(!sb) return {error:'Supabase client not configured'};
  const {data, error} = await sb.from('bookings').update({status}).eq('id', id).select();
  if(error){ console.error('updateBookingStatus failed:', describeErr(error)); return {error: describeErr(error)}; }
  if(!data || data.length===0){
    // Postgres/RLS silently blocks writes it doesn't allow — no error is
    // raised, it just quietly updates zero rows. That's what happened here.
    return {error: "That change didn't save — you may not have permission to update this booking."};
  }
  return {success:true};
}

async function createStaffAccount(payload){
  if(!sb) return {error:'Supabase client not configured'};
  try{
    const {data:{session}} = await sb.auth.getSession();
    if(!session) return {error:'Not signed in'};
    const {data, error} = await sb.functions.invoke('create-staff', {
      body: payload,
      headers: {Authorization: `Bearer ${session.access_token}`}
    });
    if(error){
      // supabase-js wraps non-2xx responses in a generic error; try to
      // pull the real message out of the function's JSON body if present.
      let msg = error.message;
      try{
        const ctx = error.context;
        if(ctx && typeof ctx.json === 'function'){
          const body = await ctx.json();
          if(body?.error) msg = body.error;
        }
      }catch(_){}
      return {error: msg};
    }
    if(data?.error) return {error: data.error};
    return {success:true};
  }catch(e){
    return {error: describeErr(e)};
  }
}
async function deleteStaffAccount(staffId){
  if(!sb) return {error:'Supabase client not configured'};
  try{
    const {data:{session}} = await sb.auth.getSession();
    if(!session) return {error:'Not signed in'};
    const {data, error} = await sb.functions.invoke('delete-staff', {
      body: {staffId},
      headers: {Authorization: `Bearer ${session.access_token}`}
    });
    if(error){
      let msg = error.message;
      try{
        const ctx = error.context;
        if(ctx && typeof ctx.json === 'function'){
          const body = await ctx.json();
          if(body?.error) msg = body.error;
        }
      }catch(_){}
      return {error: msg};
    }
    if(data?.error) return {error: data.error};
    return {success:true};
  }catch(e){
    return {error: describeErr(e)};
  }
}
async function loginWithEmail(email, password){
  if(!sb) return {error:'not configured'};
  const {data, error} = await sb.auth.signInWithPassword({email, password});
  if(error) return {error: error.message};
  const profile = await loadStaffProfile(data.user.id);
  if(!profile){
    await sb.auth.signOut();
    return {error:'No staff profile found for this account. Ask an admin to set one up.'};
  }
  return {profile};
}

  if(!sb) return null;
  try{
    const {data:{session}} = await sb.auth.getSession();
    if(!session) return null;
    return await loadStaffProfile(session.user.id);
  }catch(e){ return null; }
}
async function requestPasswordReset(email){
  if(!sb) return {error:'Supabase client not configured'};
  // Note: no custom hash here — Supabase appends its own recovery token
  // to the hash fragment of this URL, which would collide with a custom
  // route. We detect the recovery flow via onAuthStateChange instead
  // (see init(), which listens for the PASSWORD_RECOVERY event).
  const {error} = await sb.auth.resetPasswordForEmail(email, {
    redirectTo: SITE_RETURN_URL
  });
  if(error) return {error: error.message};
  return {success:true};
}

  const {error} = await sb.auth.updateUser({password: newPassword});
  if(error) return {error: error.message};

/* --- Persist the customer's own receipt locally, so a refresh doesn't
   lose it. This only lives in their own browser — customers have no
   database access to bookings at all, so there's nothing server-side
   to fetch it back from. Expires after 24h so it doesn't resurface on
   an unrelated visit days later. --- */
const THEME_STORAGE_KEY = 'nossa_theme';
function setTheme(mode){
  state.theme = mode;
  document.documentElement.setAttribute('data-theme', mode);
  try{ localStorage.setItem(THEME_STORAGE_KEY, mode); }catch(e){}
}
function initTheme(){
  let saved = null;
  try{ saved = localStorage.getItem(THEME_STORAGE_KEY); }catch(e){}
  if(!saved){
    // follow the device preference the first time
    saved = (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'dark' : 'light';
  }
  setTheme(saved);
}

const RECEIPT_STORAGE_KEY = 'nossa_last_receipt';
function saveReceiptToStorage(booking){
  try{ localStorage.setItem(RECEIPT_STORAGE_KEY, JSON.stringify({booking, savedAt: Date.now()})); }catch(e){}
}
function loadReceiptFromStorage(){
  try{
    const raw = localStorage.getItem(RECEIPT_STORAGE_KEY);
    if(!raw) return null;
    const {booking, savedAt} = JSON.parse(raw);
    if(Date.now() - savedAt > 24*60*60*1000) { clearReceiptFromStorage(); return null; }
    return booking;
  }catch(e){ return null; }
}
function clearReceiptFromStorage(){
  try{ localStorage.removeItem(RECEIPT_STORAGE_KEY); }catch(e){}
}

/* ---- hidden manager route ----
   The manager login lives at its own URL (a hash route), not a visible
   nav button. Visiting #nosa-manager shows the login page; once signed
   in, the same route shows the dashboard. Leaving the route (or logging
   out) returns to the public site. */
const MANAGER_ROUTE = '#nosa-manager';

function syncViewFromHash(){
  if(window.location.hash === MANAGER_ROUTE){
    state.view = state.adminAuthed ? 'admin' : 'admin-login';
  }else if(window.location.hash.startsWith('#/pay-confirm')){
    const q = new URLSearchParams(window.location.hash.split('?')[1] || '');
    state.fawryRef = q.get('ref');
    state.view = q.get('status')==='ok' ? 'pay-cvv' : 'pay-fail';
  }else if(state.view==='admin' || state.view==='admin-login'){
    state.view = 'home';
  }
}

function next2Days(){
  const days=[]; const now=new Date();
  for(let i=0;i<2;i++){
    const d=new Date(now); d.setDate(now.getDate()+i);
    days.push({
      key: d.toISOString().slice(0,10),
      dow: i===0 ? 'Today' : (i===1 ? 'Tomorrow' : d.toLocaleDateString('en-US',{weekday:'short'})),
      dom: d.getDate(),
      full: d.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'})
    });
  }
  return days;
}
function toMinutes(t){ const [h,m]=t.split(':').map(Number); return h*60+m; }
function fromMinutes(mins){
  const h=Math.floor(mins/60)%24, m=mins%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
function selectedServices(){
  const ids = state.sel.serviceIds || [];
  return (state.services||[]).filter(s=>ids.includes(s.id));
}
function selectedDuration(){
  const svcs = selectedServices();
  if(svcs.length===0) return 30;
  return svcs.reduce((sum,s)=>sum+s.durationMinutes, 0);
}
function selectedPrice(barber){
  const base = barber ? barber.price : 0;
  return base + selectedServices().reduce((sum,s)=>sum+s.price, 0);
}

/* Working hours for a barber on a specific date. Falls back to the
   barber's single start/end if no weekly schedule row exists, so
   barbers without a configured schedule keep working as before. */
function workingHoursFor(barber, dateKey){
  const dow = new Date(dateKey+'T00:00:00').getDay();
  const sch = (state.schedules||[]).find(s=>s.barberId===barber.id && s.dayOfWeek===dow);
  if(sch){
    if(sch.isOff) return null; // barber doesn't work this day
    return {start:sch.start, end:sch.end};
  }
  return {start:barber.start, end:barber.end};
}

function timeSlotsFor(barber, dateKey){
  if(!barber) return [];
  const hours = workingHoursFor(barber, dateKey);
  if(!hours) return []; // day off

  const needed = selectedDuration();
  const interval = barber.slotInterval || 30;
  const slots=[];
  let cur = toMinutes(hours.start);
  let end = toMinutes(hours.end);
  if(end <= cur) end += 24*60; // shift crosses midnight, e.g. 17:00 -> 01:00
  while(cur < end){
    slots.push(cur);
    cur += interval;
  }

  // Already-booked ranges.
  const busy = (state.takenSlots||[]).map(t=>{
    const s = toMinutes(t.time);
    return [s, s + (Number(t.duration_minutes) || 30)];
  });
  // Staff-blocked ranges (breaks, lunch, external appointments).
  const blocked = (state.timeOff||[]).map(t=>{
    let s = toMinutes(t.start), e = toMinutes(t.end);
    if(e <= s) e += 24*60;
    return [s, e];
  });

  const now = new Date();
  const isToday = dateKey === now.toISOString().slice(0,10);
  const nowMinutes = now.getHours()*60 + now.getMinutes();

  return slots.map(startMin=>{
    const endMin = startMin + needed;
    const passed = isToday && startMin <= nowMinutes;
    const overlaps = busy.some(([bs,be]) => startMin < be && endMin > bs);
    const isBlocked = blocked.some(([bs,be]) => startMin < be && endMin > bs);
    const tooLate = endMin > end;
    return {
      time: fromMinutes(startMin),
      taken: overlaps,
      blocked: isBlocked,
      passed,
      tooLate
    };
  });
}
async function loadTakenSlots(barberId, dateKey){
  if(!sb || !barberId || !dateKey) { state.takenSlots = []; state.timeOff = []; return; }
  try{
    const [slotsRes, offRows] = await Promise.all([
      sb.from('public_booked_slots').select('time, duration_minutes').eq('barber_id', barberId).eq('date', dateKey),
      loadTimeOff(barberId, dateKey)
    ]);
    if(slotsRes.error) throw slotsRes.error;
    state.takenSlots = slotsRes.data || [];
    state.timeOff = offRows || [];
  }catch(e){
    console.error('loadTakenSlots failed:', describeErr(e));
    state.takenSlots = [];
    state.timeOff = [];
  }
}
function fmtTime(t){
  const [h,m]=t.split(':').map(Number);
  const ap = h>=12 ? 'PM':'AM';
  const hh = h%12===0?12:h%12;
  return hh+':'+String(m).padStart(2,'0')+' '+ap;
}
function fmtDate(dateKey){
  const d=new Date(dateKey+'T00:00:00');
  return d.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric'});
}
function getBarber(id){ return state.barbers.find(b=>b.id===id); }
function money(n){ return Number(n).toLocaleString('en-US') + ' EGP'; }
function revenuePeriodBounds(period){
  const now = new Date();
  const todayStr = now.toISOString().slice(0,10);
  if(period==='today') return {start:todayStr, end:todayStr};
  if(period==='week'){
    const dow = now.getDay(); // 0=Sunday
    const start = new Date(now); start.setDate(now.getDate()-dow);
    const end = new Date(start); end.setDate(start.getDate()+6);
    return {start:start.toISOString().slice(0,10), end:end.toISOString().slice(0,10)};
  }
  if(period==='month'){
    const start = new Date(now.getFullYear(), now.getMonth(), 1);
    const end = new Date(now.getFullYear(), now.getMonth()+1, 0);
    return {start:start.toISOString().slice(0,10), end:end.toISOString().slice(0,10)};
  }
  if(period==='year'){
    const start = new Date(now.getFullYear(), 0, 1);
    const end = new Date(now.getFullYear(), 11, 31);
    return {start:start.toISOString().slice(0,10), end:end.toISOString().slice(0,10)};
  }
  return {start:null, end:null}; // 'all'
}

let logoClickCount = 0;
let logoClickTimer = null;

function attachHomeEvents(){
  const logo = document.getElementById('nosa-logo');
  if(logo){
    logo.addEventListener('click', ()=>{
      logoClickCount++;
      clearTimeout(logoClickTimer);
      logoClickTimer = setTimeout(()=>{ logoClickCount = 0; }, 1500);
      if(logoClickCount >= 5){
        logoClickCount = 0;
        try{ window.location.hash = MANAGER_ROUTE; }catch(e){}
        state.view = state.adminAuthed ? 'admin' : 'admin-login';
        state.loginError='';
        render();
      }
    });
  }
  document.querySelectorAll('[data-action]').forEach(el=>{
    el.addEventListener('click', async (e)=>{
      const action = el.dataset.action;
      if(action==='pick-barber'){ resetBooking(); state.sel.barberId=el.dataset.id; state.sel.branchId=(getBarber(el.dataset.id)||{}).branchId||null; state.step=3; render(); document.getElementById('booking').scrollIntoView({behavior:'smooth'}); return; }
      if(action==='toggle-theme'){
        setTheme(state.theme==='dark' ? 'light' : 'dark');
        render(); return;
      }
      if(action==='toggle-lang'){
        state.lang = state.lang==='ar' ? 'en' : 'ar';
        document.documentElement.setAttribute('dir', state.lang==='ar' ? 'rtl' : 'ltr');
        document.documentElement.setAttribute('lang', state.lang);
        render(); return;
      }
      if(action==='sel-branch'){
        state.sel.branchId = el.dataset.id;
        state.sel.barberId = null; state.sel.time = null;
        render(); return;
      }
      if(action==='book-branch'){
        resetBooking();
        state.sel.branchId = el.dataset.id;
        state.step = 2;
        render();
        const el2=document.getElementById('book'); if(el2) el2.scrollIntoView({behavior:'smooth'});
        return;
      }
      if(action==='sel-barber'){ state.sel.barberId=el.dataset.id; render(); return; }
      if(action==='toggle-service'){
        const id = el.dataset.id;
        const cur = state.sel.serviceIds || [];
        state.sel.serviceIds = cur.includes(id) ? cur.filter(x=>x!==id) : [...cur, id];
        state.sel.time = null; // duration changed, so any picked time may no longer fit
        render(); return;
      }
      if(action==='sel-date'){ state.sel.date=el.dataset.key; state.sel.time=null; render(); return; }
      if(action==='sel-time'){ state.sel.time=el.dataset.time; render(); return; }
      if(action==='sel-pay'){ state.sel.payment=el.dataset.p; render(); return; }
      if(action==='prev-step'){ state.step=Math.max(1,state.step-1); render(); return; }
      if(action==='next-step'){
        if(state.step===4){
          // about to show the time picker — fetch fresh availability first
          const btn=el;
          btn.disabled=true; btn.textContent='Loading times…';
          await loadTakenSlots(state.sel.barberId, state.sel.date);
          btn.disabled=false; btn.textContent='Continue →';
        }
        state.step=Math.min(7,state.step+1); render(); return;
      }
      if(action==='submit-details'){
        const name=document.getElementById('in-name').value.trim();
        const phone=document.getElementById('in-phone').value.trim();
        const email=document.getElementById('in-email').value.trim();
        const errEl=document.getElementById('details-err');
        if(!name || !phone || !email){ errEl.textContent='Please enter your full name, phone number, and email.'; return; }
        if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){ errEl.textContent='Enter a valid email address.'; return; }
        state.sel.name=name; state.sel.phone=phone; state.sel.email=email; state.step=7; render(); return;
      }
      if(action==='confirm-booking'){
        if(state.sel.payment==='online'){
          const errEl=document.getElementById('card-err');
          const btn=el;
          btn.disabled=true; btn.textContent='Redirecting to Fawry…';
          const ok = await startFawryPayment();
          if(!ok){
            btn.disabled=false; btn.textContent='Confirm Booking';
            if(errEl) errEl.textContent='Could not start the payment. Please try again.';
          }
          return; // startFawryPayment navigates away on success — nothing more to do here
        }
        const btn=el;
        const errEl=document.getElementById('confirm-err');
        btn.disabled=true; btn.textContent='Confirming…';
        const result = await finalizeBooking();
        if(result?.error){
          if(result.conflict){
            await loadTakenSlots(state.sel.barberId, state.sel.date);
            state.sel.time = null;
            state.step = 4;
            state.timeStepNotice = result.error;
            render();
            return;
          }
          btn.disabled=false; btn.textContent='Confirm Booking';
          if(errEl) errEl.textContent = "Couldn't save your booking — please try again or contact the shop.";
          return;
        }
        render();
        return;
      }
      if(action==='new-booking'){ state.lastBooking=null; clearReceiptFromStorage(); resetBooking(); render(); return; }
      if(action==='submit-cvv'){
        const cvv=document.getElementById('pay-cvv').value.trim();
        const errEl=document.getElementById('pay-cvv-err');
        if(!/^\d{3,4}$/.test(cvv)){ errEl.textContent='Enter a valid 3 or 4 digit CVV.'; return; }
        const ref = state.fawryRef;
        const btn=el;
        btn.disabled=true; btn.textContent='Processing…';
        try{
          const res = await fetch(FAWRY_CHARGE_FN_URL, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body: JSON.stringify({ref, cvv})
          });
          const data = await res.json();
          if(data.redirectUrl){
            window.location.href = data.redirectUrl; // bank's 3DS challenge
            return;
          }
          if(data.success){
            state.view='pay-success';
            render();
          }else{
            btn.disabled=false; btn.textContent='Pay Now';
            errEl.textContent = data.error || 'Payment failed. Please try again.';
          }
        }catch(e){
          btn.disabled=false; btn.textContent='Pay Now';
          errEl.textContent = 'Could not reach the payment server.';
        }
        return;
      }
    });
  });
  const proofInput=document.getElementById('instapay-proof');
  if(proofInput) proofInput.addEventListener('change', async ()=>{
    const file = proofInput.files[0];
    if(!file) return;
    const errEl=document.getElementById('proof-err');
    if(errEl) errEl.textContent='';
    const result = await uploadPaymentProof(file);
    if(result.error){
      if(errEl) errEl.textContent = "Couldn't upload that screenshot — try again.";
      return;
    }
    state.sel.paymentProofPath = result.path;
    render();
  });
}

function resetBooking(){
  state.step=1;
  state.sel={ branchId:null, barberId:null, serviceIds:[], date:null, time:null, name:'', phone:'', email:'', payment:null, paymentProofPath:null };
}

async function finalizeBooking(){
  const barber = getBarber(state.sel.barberId);
  const svcs = selectedServices();
  const booking = {
    id: uid('bk'),
    name: state.sel.name,
    phone: state.sel.phone,
    email: state.sel.email,
    barberId: barber.id,
    barberName: barber.name,
    date: state.sel.date,
    time: state.sel.time,
    payment: state.sel.payment,
    price: selectedPrice(barber),
    status: 'confirmed',
    createdAt: new Date().toISOString(),
    paymentProofPath: state.sel.paymentProofPath,
    branchId: state.sel.branchId,
    branchName: ((state.branches||[]).find(b=>b.id===state.sel.branchId)||{}).name || null,
    serviceIds: svcs.map(s=>s.id),
    serviceNames: svcs.map(s=>s.name).join(', '),
    durationMinutes: selectedDuration()
  };
  state.bookings.unshift(booking);
  const result = await insertBookingRow(booking);
  if(result?.error){
    state.bookings = state.bookings.filter(b => b.id !== booking.id); // roll back — it never actually saved
    return {error: result.error, conflict: result.conflict};
  }
  state.lastBooking = booking;
  saveReceiptToStorage(booking);
  return {success:true};
}

/* --- FawryPay: start card payment (redirects to Fawry's hosted page) --- */
async function startFawryPayment(){
  if(!sb) return false;
  const barber = getBarber(state.sel.barberId);
  if(!barber) return false;

  // Double-check this slot is still open right before sending the
  // customer off to pay — no point charging a card for a slot someone
  // else just took.
  await loadTakenSlots(barber.id, state.sel.date);
  const stillOpen = !state.takenSlots.some(t => t.time === state.sel.time);
  if(!stillOpen){
    state.sel.time = null;
    state.step = 4;
    state.timeStepNotice = "That time was just booked by someone else — pick another time.";
    render();
    return true; // handled with its own message — caller shouldn't show a generic fallback error
  }

  const ref = String(Date.now()) + Math.floor(Math.random()*900+100);
  const svcs = selectedServices();
  const row = {
    ref,
    booking_name: state.sel.name,
    booking_phone: state.sel.phone,
    booking_email: state.sel.email,
    branch_id: state.sel.branchId,
    branch_name: ((state.branches||[]).find(b=>b.id===state.sel.branchId)||{}).name || null,
    barber_id: barber.id,
    barber_name: barber.name,
    booking_date: state.sel.date,
    booking_time: state.sel.time,
    amount: selectedPrice(barber),
    service_ids: svcs.map(s=>s.id),
    service_names: svcs.map(s=>s.name).join(', '),
    duration_minutes: selectedDuration(),
    status: 'pending'
  };
  const {error} = await sb.from('fawry_pending_payments').insert(row);
  if(error){ console.error('startFawryPayment failed:', describeErr(error)); return false; }
  state.fawryRef = ref;
  const returnUrl = `${FAWRY_TOKEN_CALLBACK_URL}?ref=${encodeURIComponent(ref)}`;
  const tokenizeUrl = `${FAWRY_BASE_URL}/atfawry/plugin/card-token?accNo=${encodeURIComponent(FAWRY_MERCHANT_CODE)}&customerProfileId=${encodeURIComponent(ref)}&returnUrl=${encodeURIComponent(returnUrl)}&locale=en`;
  window.location.href = tokenizeUrl;
  return true;
}

async function startScanner(){
  const video = document.getElementById('scanner-video');
  const canvas = document.getElementById('scanner-canvas');
  if(!video || !canvas || typeof jsQR === 'undefined') return;
  try{
    scannerStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject = scannerStream;
    await video.play();
  }catch(e){
    const errEl = document.getElementById('scanner-err');
    if(errEl) errEl.textContent = "Couldn't access the camera — check your browser's camera permission for this site.";
    return;
  }
  const ctx = canvas.getContext('2d');
  scannerInterval = setInterval(()=>{
    if(!video.videoWidth || video.readyState < video.HAVE_ENOUGH_DATA) return;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const code = jsQR(imageData.data, imageData.width, imageData.height);
    if(code && code.data) handleScanResult(code.data);
  }, 300);
}
function stopScanner(){
  if(scannerInterval){ clearInterval(scannerInterval); scannerInterval = null; }
  if(scannerStream){ scannerStream.getTracks().forEach(t=>t.stop()); scannerStream = null; }
}
function handleScanResult(text){
  stopScanner();
  const prefix = 'nossa:booking:';
  if(!text.startsWith(prefix)){
    state.scannerResult = {error:'That QR code is not a Nossa booking code.'};
    render();
    return;
  }
  const id = text.slice(prefix.length);
  const booking = state.bookings.find(b=>b.id===id);
  if(!booking){
    state.scannerResult = {error:"Couldn't find that booking on this device — try refreshing the admin page first."};
    render();
    return;
  }
  state.scannerResult = {booking};
  render();
}
async function checkInBookingRow(id){
  if(!sb) return {error:'Supabase client not configured'};
  const {data, error} = await sb.from('bookings').update({checked_in_at: new Date().toISOString()}).eq('id', id).select();
  if(error){ console.error('checkInBooking failed:', describeErr(error)); return {error: describeErr(error)}; }
  if(!data || data.length===0) return {error:"That change didn't save — you may not have permission to check in this booking."};
  return {success:true, checkedInAt: data[0].checked_in_at};
}

function resizeImageFile(file, maxDim=240, quality=0.82){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w=img.width, h=img.height;
        if(w>h && w>maxDim){ h=Math.round(h*maxDim/w); w=maxDim; }
        else if(h>=w && h>maxDim){ w=Math.round(w*maxDim/h); h=maxDim; }
        const canvas=document.createElement('canvas');
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.onerror = ()=>reject(new Error('Could not read image'));
      img.src = e.target.result;
    };
    reader.onerror = ()=>reject(new Error('Could not read file'));
    reader.readAsDataURL(file);
  });
}

    el.addEventListener('click', async ()=>{
      const action=el.dataset.action;
      if(action==='view-site'){ window.location.hash=''; state.view='home'; render(); return; }
      if(action==='logout'){ stopScanner(); await logoutStaff(); state.adminAuthed=false; state.currentStaff=null; window.location.hash=''; state.view='home'; render(); return; }
      const staff = state.currentStaff || {};
      if(action==='mark-complete'){
        if(!staff.canManage) return;
        const result = await setBookingStatus(el.dataset.id,'completed');
        if(result.error){ alert("Couldn't mark as complete: " + result.error); }
        render(); return;
      }
      if(action==='mark-cancel'){
        if(!staff.canManage) return;
        const result = await setBookingStatus(el.dataset.id,'cancelled');
        if(result.error){ alert("Couldn't cancel: " + result.error); }
        render(); return;
      }
      if(action==='view-proof'){
        const b = state.bookings.find(x=>x.id===el.dataset.id);
        if(!b?.paymentProofPath) return;
        const url = await getPaymentProofUrl(b.paymentProofPath);
        if(url) window.open(url, '_blank');
        else alert("Couldn't load that screenshot.");
        return;
      }
      if(action==='mark-verified'){
        if(!staff.canManage) return;
        const b = state.bookings.find(x=>x.id===el.dataset.id);
        if(!b) return;
        const result = await markPaymentVerifiedRow(b.id);
        if(result.error){ alert("Couldn't mark as verified: " + result.error); return; }
        b.paymentVerified = true;
        render();
        return;
      }
      if(action==='open-scanner'){
        if(!staff.canManage) return;
        state.showScanner = true;
        state.scannerResult = null;
        render();
        startScanner();
        return;
      }
      if(action==='close-scanner'){
        stopScanner();
        state.showScanner = false;
        state.scannerResult = null;
        render();
        return;
      }
      if(action==='scan-again'){
        state.scannerResult = null;
        render();
        startScanner();
        return;
      }
      if(action==='confirm-checkin'){
        if(!staff.canManage) return;
        const id = el.dataset.id;
        const result = await checkInBookingRow(id);
        if(result.error){ alert("Couldn't check in: " + result.error); return; }
        if(state.scannerResult?.booking) state.scannerResult.booking.checkedInAt = result.checkedInAt;
        const b = state.bookings.find(x=>x.id===id);
        if(b) b.checkedInAt = result.checkedInAt;
        render();
        return;
      }
      if(action==='reject-payment'){
        if(!staff.canManage) return;
        const b = state.bookings.find(x=>x.id===el.dataset.id);
        if(!b) return;
        if(!confirm(`Reject this Instapay screenshot? This cancels ${b.name}'s booking and frees up ${fmtTime(b.time)} on ${fmtDate(b.date)} for someone else.`)) return;
        const result = await setBookingStatus(b.id, 'cancelled');
        if(result.error){ alert("Couldn't reject: " + result.error); }
        render();
        return;
      }
      if(action==='save-interval'){
        if(!staff.canManage) return;
        const barberId = el.dataset.barber;
        const interval = parseInt(document.getElementById('sch-interval').value, 10) || 30;
        el.disabled=true; el.textContent='Saving…';
        const result = await updateBarberInterval(barberId, interval);
        el.disabled=false; el.textContent='Save';
        if(result.error){ alert("Couldn't save: " + result.error); return; }
        state.barbers = await loadBarbers();
        render(); return;
      }
      if(action==='save-schedule'){
        if(!staff.canManage) return;
        const dow = parseInt(el.dataset.dow, 10);
        const barberId = el.dataset.barber;
        const start = document.getElementById('sch-start-'+dow).value;
        const end = document.getElementById('sch-end-'+dow).value;
        const isOff = document.getElementById('sch-off-'+dow).checked;
        if(!isOff && (!start || !end || start===end)){ alert('Set a valid start and end time, or mark the day off.'); return; }
        el.disabled=true; el.textContent='Saving…';
        const existing = (state.schedules||[]).find(s=>s.barberId===barberId && s.dayOfWeek===dow);
        const result = await saveSchedule({id: existing?.id || uid('sch'), barberId, dayOfWeek:dow, start, end, isOff});
        el.disabled=false; el.textContent='Save';
        if(result.error){ alert("Couldn't save: " + result.error); return; }
        state.schedules = await loadSchedules();
        render(); return;
      }
      if(action==='add-timeoff'){
        if(!staff.canManage) return;
        const barberId = el.dataset.barber;
        const date = document.getElementById('to-date').value;
        const start = document.getElementById('to-start').value;
        const end = document.getElementById('to-end').value;
        const reason = document.getElementById('to-reason').value.trim();
        const errEl = document.getElementById('to-err');
        if(!date || !start || !end){ errEl.textContent='Pick a date and a time range.'; return; }
        if(start === end){ errEl.textContent="Start and end time can't be the same."; return; }
        errEl.textContent='';
        el.disabled=true; el.textContent='Adding…';
        const result = await insertTimeOff({id:uid('off'), barberId, date, start, end, reason});
        el.disabled=false; el.textContent='Add';
        if(result.error){ errEl.textContent = result.error; return; }
        state.timeOffAll = await loadTimeOff(null, null);
        render(); return;
      }
      if(action==='remove-timeoff'){
        if(!staff.canManage) return;
        const result = await deleteTimeOffRow(el.dataset.id);
        if(result.error){ alert("Couldn't remove: " + result.error); return; }
        state.timeOffAll = await loadTimeOff(null, null);
        render(); return;
      }
      if(action==='add-service'){
        if(!staff.canManageBarbers) return;
        state.showServiceModal=true; state.editingServiceId=null;
        state.newService={name:'', description:'', price:0, durationMinutes:30, active:true};
        render(); return;
      }
      if(action==='edit-service'){
        if(!staff.canManageBarbers) return;
        const svc = (state.services||[]).find(x=>x.id===el.dataset.id);
        if(!svc) return;
        state.showServiceModal=true; state.editingServiceId=svc.id;
        state.newService={name:svc.name, description:svc.description||'', price:svc.price, durationMinutes:svc.durationMinutes, active:svc.active};
        render(); return;
      }
      if(action==='close-service'){ state.showServiceModal=false; state.editingServiceId=null; render(); return; }
      if(action==='remove-service'){
        if(!staff.canManageBarbers) return;
        const svc = (state.services||[]).find(x=>x.id===el.dataset.id);
        if(!svc) return;
        if(!confirm(`Delete "${svc.name}"? Existing bookings keep their recorded services, but customers won't be able to pick this anymore.`)) return;
        const result = await deleteServiceRow(svc.id);
        if(result.error){ alert("Couldn't delete: " + result.error); return; }
        state.services = await loadServices();
        render(); return;
      }
      if(action==='save-service'){
        if(!staff.canManageBarbers) return;
        const name=document.getElementById('sv-name').value.trim();
        const description=document.getElementById('sv-desc').value.trim();
        const price=parseFloat(document.getElementById('sv-price').value);
        const durationMinutes=parseInt(document.getElementById('sv-duration').value, 10);
        const active=document.getElementById('sv-active').checked;
        const errEl=document.getElementById('sv-err');
        if(!name){ errEl.textContent='Give the service a name.'; return; }
        if(isNaN(price) || price<0){ errEl.textContent='Enter a valid price (0 or more).'; return; }
        if(isNaN(durationMinutes) || durationMinutes<5){ errEl.textContent='Duration must be at least 5 minutes.'; return; }
        const btn=el; btn.disabled=true; btn.textContent='Saving…';
        let result;
        if(state.editingServiceId){
          const existing = state.services.find(x=>x.id===state.editingServiceId);
          result = await updateService({id:state.editingServiceId, name, description, price, durationMinutes, active, isBase:existing?.isBase||false, sortOrder:existing?.sortOrder||0});
        }else{
          const maxOrder = (state.services||[]).reduce((m,s)=>Math.max(m, s.sortOrder), 0);
          result = await insertService({id:uid('svc'), name, description, price, durationMinutes, active, isBase:false, sortOrder:maxOrder+1});
        }
        btn.disabled=false; btn.textContent = state.editingServiceId ? 'Save Changes' : 'Add Service';
        if(result.error){ errEl.textContent = result.error; return; }
        state.showServiceModal=false; state.editingServiceId=null;
        state.services = await loadServices();
        render(); return;
      }
      if(action==='add-barber'){ if(!staff.canManageBarbers) return; state.showAddBarber=true; state.editingBarberId=null; state.newBarber={name:'',specialty:'',price:'',start:'09:00',end:'19:00',instapay:'',photo:null,slotInterval:30,branchId:(state.branches||[])[0]?.id||null}; render(); return; }
      if(action==='edit-barber'){
        if(!staff.canManageBarbers) return;
        const b = getBarber(el.dataset.id);
        state.showAddBarber=true; state.editingBarberId=b.id;
        state.newBarber={name:b.name, specialty:b.specialty, price:b.price, start:b.start, end:b.end, instapay:b.instapay||'', photo:b.photo||null, slotInterval:b.slotInterval||30, branchId:b.branchId||null};
        render(); return;
      }
      if(action==='close-add-barber'){ state.showAddBarber=false; state.editingBarberId=null; render(); return; }
      if(action==='remove-barber'){
        if(!staff.canManageBarbers) return;
        if(state.barbers.length<=1){ alert('You need at least one barber.'); return; }
        const id = el.dataset.id;
        const removed = state.barbers.find(b=>b.id===id);
        state.barbers = state.barbers.filter(b=>b.id!==id);
        render();
        const err = await deleteBarberRow(id);
        if(err){
          alert("Couldn't remove that barber from the database: " + describeErr(err));
          state.barbers = await loadBarbers();
          render();
        }
        return;
      }
      if(action==='save-barber'){
        if(!staff.canManageBarbers) return;
        const name=document.getElementById('nb-name').value.trim();
        const spec=document.getElementById('nb-spec').value.trim();
        const price=parseFloat(document.getElementById('nb-price').value);
        const start=document.getElementById('nb-start').value;
        const end=document.getElementById('nb-end').value;
        const instapay=document.getElementById('nb-instapay').value.trim();
        const slotInterval=parseInt(document.getElementById('nb-interval').value, 10) || 30;
        const branchSel=document.getElementById('nb-branch');
        const branchId=branchSel ? branchSel.value : null;
        const errEl=document.getElementById('nb-err');
        if(!name || !spec || !price || price<=0 || !start || !end || !instapay){
          errEl.textContent='Please fill in every field, including an Instapay account.'; return;
        }
        if(start === end){
          errEl.textContent='Start and end time can\'t be the same.'; return;
        }
        if(state.editingBarberId){
          const b = getBarber(state.editingBarberId);
          b.name=name; b.specialty=spec; b.price=price; b.start=start; b.end=end; b.instapay=instapay; b.slotInterval=slotInterval; b.branchId=branchId;
          b.photo=state.newBarber.photo || null;
          b.initials = name.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
          state.showAddBarber=false; state.editingBarberId=null; render();
          const err = await updateBarber(b);
          if(err){
            alert("Couldn't save changes to the database: " + describeErr(err));
            state.barbers = await loadBarbers();
            render();
          }
        }else{
          const initials = name.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
          const newBarber = {id:uid('bar'), name, specialty:spec, price, start, end, instapay, initials, photo:state.newBarber.photo||null, slotInterval, branchId};
          state.barbers.push(newBarber);
          state.showAddBarber=false; state.editingBarberId=null; render();
          const err = await insertBarber(newBarber);
          if(err){
            alert("Couldn't save this barber to the database: " + describeErr(err));
            state.barbers = await loadBarbers();
            render();
          }
        }
        return;
      }
      if(action==='add-staff'){
        if(!staff.canManageStaff) return;
        state.showAddStaff=true;
        state.newStaff={username:'', email:'', password:'', scope:'all', barberId:state.barbers[0]?.id||null, canManage:false, canManageBarbers:false, canManageStaff:false, branchIds:[]};
        render(); return;
      }
      if(action==='close-add-staff'){ state.showAddStaff=false; render(); return; }
      if(action==='save-staff'){
        if(!staff.canManageStaff) return;
        const username=document.getElementById('ns-username').value.trim();
        const email=document.getElementById('ns-email').value.trim();
        const password=document.getElementById('ns-password').value;
        const scope=document.getElementById('ns-scope').value;
        const barberSel=document.getElementById('ns-barber');
        const barberId = scope==='barber' ? (barberSel ? barberSel.value : null) : null;
        const canManage=document.getElementById('ns-can-manage').checked;
        const canManageBarbers=document.getElementById('ns-can-manage-barbers').checked;
        const canManageStaff=document.getElementById('ns-can-manage-staff').checked;
        const branchIds=Array.from(document.querySelectorAll('.ns-branch:checked')).map(x=>x.value);
        const errEl=document.getElementById('ns-err');
        if(!username || !email || !password){
          errEl.textContent='Please fill in username, email, and password.'; return;
        }
        if(password.length<6){
          errEl.textContent='Password must be at least 6 characters.'; return;
        }
        if(scope==='barber' && !barberId){
          errEl.textContent='Choose which barber this account belongs to.'; return;
        }
        const btn=document.querySelector('[data-action="save-staff"]');
        btn.disabled=true; btn.textContent='Creating…';
        const result = await createStaffAccount({email, password, username, scope, barberId, canManage, canManageBarbers, canManageStaff, branchIds});
        btn.disabled=false; btn.textContent='Create Account';
        if(result.error){
          errEl.textContent = result.error;
          return;
        }
        state.showAddStaff=false;
        state.staffList = await loadAllStaff();
        render();
        return;
      }
      if(action==='delete-staff'){
        if(!staff.canManageStaff) return;
        const targetId = el.dataset.id;
        const username = el.dataset.username;
        if(!confirm(`Delete ${username}'s staff account? They'll lose access immediately. This can't be undone.`)) return;
        el.disabled=true; el.textContent='Deleting…';
        const result = await deleteStaffAccount(targetId);
        if(result.error){
          alert("Couldn't delete that account: " + result.error);
          el.disabled=false; el.textContent='Delete';
          return;
        }
        state.staffList = await loadAllStaff();
        render();
        return;
      }
    });
  });
  const fs=document.getElementById('f-status'), fb=document.getElementById('f-barber');
  if(fs) fs.addEventListener('change', ()=>{ state.adminFilters.status=fs.value; render(); });
  if(fb) fb.addEventListener('change', ()=>{ state.adminFilters.barberId=fb.value; render(); });
  const frp=document.getElementById('f-revenue-period');
  if(frp) frp.addEventListener('change', ()=>{ state.revenuePeriod=frp.value; render(); });
  const fsb=document.getElementById('f-schedule-barber');
  if(fsb) fsb.addEventListener('change', ()=>{ state.scheduleBarberId=fsb.value; render(); });
  const nsScope=document.getElementById('ns-scope');
  if(nsScope) nsScope.addEventListener('change', ()=>{
    // preserve whatever's already entered before re-rendering the modal
    state.newStaff.username = document.getElementById('ns-username').value;
    state.newStaff.email = document.getElementById('ns-email').value;
    state.newStaff.password = document.getElementById('ns-password').value;
    state.newStaff.canManage = document.getElementById('ns-can-manage').checked;
    state.newStaff.canManageBarbers = document.getElementById('ns-can-manage-barbers').checked;
    state.newStaff.canManageStaff = document.getElementById('ns-can-manage-staff').checked;
    state.newStaff.branchIds = Array.from(document.querySelectorAll('.ns-branch:checked')).map(x=>x.value);
    state.newStaff.scope = nsScope.value;
    if(state.newStaff.scope==='barber' && !state.newStaff.barberId) state.newStaff.barberId = state.barbers[0]?.id || null;
    render();
  });
  const photoInput=document.getElementById('nb-photo');
  if(photoInput) photoInput.addEventListener('change', async ()=>{
    const file = photoInput.files[0];
    if(!file) return;
    const errEl=document.getElementById('nb-err');
    try{
      // show a quick local preview immediately, then swap in the hosted URL
      const dataUrl = await resizeImageFile(file);
      state.newBarber.photo = dataUrl;
      render();
      const resizedBlob = await (await fetch(dataUrl)).blob();
      const resizedFile = new File([resizedBlob], file.name, {type:'image/jpeg'});
      const tempId = state.editingBarberId || 'new';
      const publicUrl = await uploadBarberPhoto(resizedFile, tempId);
      if(publicUrl){
        state.newBarber.photo = publicUrl;
        render();
      }else if(errEl){
        errEl.textContent='Photo preview saved locally, but upload to storage failed — check your Supabase Storage bucket/policies.';
      }
    }catch(e){
      if(errEl) errEl.textContent='Could not load that photo — try a different image.';
    }
  });
}

async function setBookingStatus(id, status){
  const b = state.bookings.find(x=>x.id===id);
  if(!b) return {error:'Booking not found'};
  const result = await updateBookingStatusRow(id, status);
  if(result.error) return result;
  b.status = status; // only reflect it locally once the write is actually confirmed
  return {success:true};
}

/* ================= INIT ================= */
(async function init(){
  initTheme();
  if(sb) sb.auth.onAuthStateChange((event)=>{
    if(event === 'PASSWORD_RECOVERY'){
      state.view = 'admin-reset-password';
      render();
    }
  });
  try{
    const profile = await restoreSession();
    if(profile){ state.currentStaff = profile; state.adminAuthed = true; }
  }catch(e){ console.error('session restore failed:', describeErr(e)); }
  syncViewFromHash();
  if(state.view === 'home'){
    const savedReceipt = loadReceiptFromStorage();
    if(savedReceipt) state.lastBooking = savedReceipt;
  }
  render();
  try{
    const [barbers, bookings, services, schedules, branches] = await Promise.all([loadBarbers(), loadBookings(), loadServices(), loadSchedules(), loadBranches()]);
    state.barbers = barbers;
    state.bookings = bookings;
    state.services = services;
    state.schedules = schedules;
    state.branches = branches;
  }catch(e){
    console.error('init failed, falling back to defaults:', describeErr(e));
    state.barbers = DEFAULT_BARBERS;
    state.bookings = [];
    state.services = [];
    state.schedules = [];
    state.branches = [];
  }finally{
    state.loading = false;
    render();
  }
  window.addEventListener('hashchange', ()=>{ syncViewFromHash(); render(); });
})();
</script>
</body>
</html>
